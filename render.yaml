services:
  - type: web
    name: shiftpilot-backend
    env: docker
    plan: free
    dockerfilePath: Dockerfile.backend
    envVars:
      - key: SHIFTPILLOT_SECRET_KEY
        value: "production-secret-key-change-me-123456"
      - key: SHIFTPILLOT_DATABASE_URL
        value: sqlite:///./shiftpilot.db
      - key: SHIFTPILLOT_BACKEND_CORS_ORIGINS
        value: https://your-frontend-url-here.vercel.app
    autoDeploy: true
